{% extends "base.html" %}{% block content %}<h2>Dispute resolution</h2>{% for d in disputes %}<div class="panel p-3 mb-3"><div class="d-flex justify-content-between"><strong>Dispute #{{ d.id }} · Evidence #{{ d.evidence_id }}</strong><span class="status {{ d.status }}">{{ d.status }}</span></div><p class="mt-2">{{ d.reason }}</p>{% if d.status == 'open' %}<form method="post" action="{{ url_for('resolve_dispute',did=d.id) }}"><textarea class="form-control mb-2" name="resolution" placeholder="Resolution notes (minimum 5 characters)" required></textarea><button class="btn btn-success btn-sm" name="status" value="resolved">Resolve</button> <button class="btn btn-outline-secondary btn-sm" name="status" value="dismissed">Dismiss</button></form>{% else %}<p class="text-secondary">{{ d.resolution }}</p>{% endif %}</div>{% else %}<p class="text-secondary">No disputes.</p>{% endfor %}{% endblock %}
