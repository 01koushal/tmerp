{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><div class="panel p-4"><span class="eyebrow">NEW RECORD</span><h2>Seal evidence</h2><p class="text-secondary">The file is split into 1 MiB parts, hashed, and encrypted before storage.</p><form method="post" enctype="multipart/form-data"><label>Evidence title</label><input class="form-control mb-3" name="title" required maxlength="180"><label>Description</label><textarea class="form-control mb-3" name="description" rows="3"></textarea><label>Evidence file</label><input class="form-control mb-3" type="file" name="file" required><label>Independent reviewers</label><div class="reviewer-list mb-3">{% for u in reviewers %}<label class="d-flex gap-2 align-items-center p-2"><input type="checkbox" name="reviewers" value="{{ u.id }}"> {{ u.name }} <span class="text-secondary small">({{ u.email }})</span></label>{% else %}<p class="text-danger">No reviewers have been assigned yet. Ask an admin to promote users to reviewer.</p>{% endfor %}</div><label>Approvals required</label><input class="form-control mb-3" type="number" name="threshold" min="1" value="1" required><button class="btn btn-primary" {% if not reviewers %}disabled{% endif %}>Encrypt & submit</button></form></div></div></div>{% endblock %}
