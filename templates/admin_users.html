{% extends "base.html" %}{% block content %}<h2>User management</h2><div class="panel p-3"><div class="table-responsive"><table class="table"><thead><tr><th>User</th><th>Email</th><th>Role</th><th>Change role</th></tr></thead><tbody>{% for u in users %}<tr><td>{{ u.name }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td><td><form method="post" class="d-flex gap-2"><input type="hidden" name="user_id" value="{{ u.id }}"><select name="role" class="form-select form-select-sm"><option>submitter</option><option>reviewer</option><option>admin</option></select><button class="btn btn-sm btn-primary">Save</button></form></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
